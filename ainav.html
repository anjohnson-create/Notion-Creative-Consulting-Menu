<!DOCTYPE html>
<html>

<head>

	<!-- Font Awesome -->

	<!-- Google Font -->

	<link rel="preconnect" href="https://fonts.googleapis.com">

	<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap" rel="stylesheet">

	<!-------->

	<style>
		* {
			margin: 0;
			padding: 0;
			-webkit-box-sizing: border-box;
			box-sizing: border-box;
		}


		.navMenu {
			font-family: 'Advent Pro', sans-serif;
			padding: 8px;
			text-align: center;
			margin: 7px auto;
			width: fit-content;
		}

		.navMenu a {
			color: #272727;
			text-decoration: none;
			text-transform: uppercase;
			display: inline-block;
			padding: 6px;
		}

		.background {
			background-color: #ece5f0;
		}

		.border {
			border: 1px solid #cccccc;

		}

		.navMenu a:hover {

			color: #0000FF;
		}
	</style>
</head>

<body>

	<nav class="navMenu  border">
		<a id="home" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-house-chimney"></i> Home</a>
		<a id="schedule" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-clipboard-list"></i> Schedule</a>

		<a id="testing" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-flask-vial"></i> Testing</a>
    <a id="case_study" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-pen-to-square"></i> Case Study</a>

	</nav>


		<script>
		// 1. Fixed style injection with !important to override the inline-block layout
		let direction = "vertical";
		if (direction === "vertical") {
			document.head.insertAdjacentHTML("beforeend", `<style>.navMenu a {display: block !important; text-align:left; margin:7px} i{width:15px; margin-right:5px} .navMenu{margin:3px}</style>`)
		}

		function navigate(id) {
			if (id == 'home')
				window.open("https://www.notion.so/AI-Assistant-Case-Study-369ad60489f780418affe0467e6968d4?source=copy_link", '_blank').focus();
			else if (id == "schedule")
				window.open("https://www.notion.so/Schedule-36dad60489f7800e98f7c36d7f332d23?source=copy_link", '_blank').focus();
			else if (id == "research")
				window.open("https://www.notion.so/Research-36dad60489f780dfad8ef19efb3b0b1a?source=copy_link", '_blank').focus();
			else if (id == "design")
				window.open("https://www.notion.so/Design-36dad60489f78035b68dd05bc6b75902?source=copy_link", '_blank').focus();
      else if (id == "testing")
				window.open("https://www.notion.so/Testing-36dad60489f780118724dde8ca3a68d3?source=copy_link", '_blank').focus();
			// 2. FIXED: Removed the double window.open here
      else if (id == "case_study")
				window.open("https://www.notion.so/Case-Study-36dad60489f780289ee2e5bda24cfd65?source=copy_link", '_blank').focus();
			else if (id == "resources")
				window.open("https://www.notion.so/Resources-36dad60489f78070a46fc2606622d313?source=copy_link", '_blank').focus();
		}
	</script>

</html>
