<!DOCTYPE html>
<html>

<head>

	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

	<!-- Google Font -->

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap" rel="stylesheet">

	<!-------->

	<style>
		* {
			margin: 0;
			padding: 0;
			-webkit-box-sizing: border-box;
			box-sizing: border-box;
		}


		.navMenu {
			font-family: 'Advent Pro', sans-serif;
			padding: 8px;
			text-align: center;
			margin: 7px auto;
			width: fit-content;
		}

		.navMenu a {
			color: #272727;
			text-decoration: none;
			text-transform: uppercase;
			display: inline-block;
			padding: 6px;
		}

		.background {
			background-color: #ece5f0;
		}

		.border {
			border: 1px solid #cccccc;

		}

		.navMenu a:hover {

			color: #054d0c;
		}
	</style>
</head>

<body>

	<nav class="navMenu  border">
		<a id="home" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-house"></i> Home</a>
		<a id="business_admin" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-screwdriver-wrench"></i> Business Admin</a>

		<a id="products_services" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-bag-shopping"></i> Products & Services</a>

	</nav>


	<script>

		let direction = "vertical";
		if (direction === "vertical") {
			document.head.insertAdjacentHTML("beforeend", `<style>.navMenu a {display: block; text-align:left; margin:7px} i{width:15px; margin-right:5px} .navMenu{margin:3px}</style>`)
		}


		function navigate(id) {

			if (id == 'home')
				window.open("https://www.notion.so/Creative-Consulting-Hub-369ad60489f7804094bafcf52bcd3533?source=copy_link", '_blank').focus();
			else if (id == "business_admin")
				window.open("https://www.notion.so/BUSINESS-ADMIN-36cad60489f7803b8344c934214cb492?source=copy_link", '_blank').focus();
			else if (id == "business_strategy")
				window.open("https://www.notion.so/BUSINESS-STRATEGY-36cad60489f780eab8ead02b70464bff?source=copy_link", '_blank').focus();
			else if (id == "projects")
				window.open("https://www.notion.so/PROJECTS-36cad60489f780d99ec1d7e852e7d334?source=copy_link", '_blank').focus();
			else if (id == "clients")
				window.open("https://www.notion.so/CLIENTS-36cad60489f7803e8e9ee4ed443260d5?source=copy_link", '_blank').focus();
			else if (id == "products_services")
				window.open("https://www.notion.so/PRODUCTS-SERVICES-36cad60489f78005919cc10c931356ac?source=copy_link", '_blank').focus();
			else if (id == "marketing")
				window.open("https://www.notion.so/MARKETING-36cad60489f7801faacbcdb577a24bf1?source=copy_link", '_blank').focus();
			else if (id == "accounting")
				window.open("https://www.notion.so/ACCOUNTING-36cad60489f780848c30dd598853b0aa?source=copy_link", '_blank').focus();
			else if (id == "resources")
				window.open("https://www.notion.so/RESOURCES-36cad60489f7806d8979dff525cc2a3f?source=copy_link", '_blank').focus();
		}
	</script>


</body>

</html>
